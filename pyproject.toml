[project]
name = "agent-group-chat"
version = "0.1.0"
description = "Multi-agent group chat framework — agents discuss, debate, and solve problems together"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.36",
    "pydantic>=2.13",
    "typer>=0.25",
    "rich>=15.0",
    "tiktoken>=0.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.2",
    "readability-lxml>=0.8",
    "ddgs>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
]

[project.scripts]
agc = "agc.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agc"]