[project]
name = "agent-group-chat"
version = "0.1.0"
description = "Multi-agent group chat framework — agents discuss, debate, and solve problems together"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30",
    "pydantic>=2.7",
    "typer[all]>=0.12",
    "rich>=13.7",
    "tiktoken>=0.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "readability-lxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[project.scripts]
agc = "agc.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agc"]