[project]
name = "agent-group-chat"
version = "0.1.0"
description = "Multi-agent group chat framework — agents discuss, debate, and solve problems together"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.36",
    "pydantic>=2.13",
    "typer>=0.25",
    "rich>=15.0",
    "tiktoken>=0.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.2",
    "httpx>=0.28",
    "readability-lxml>=0.8",
    "ddgs>=9.14",
    "prompt-toolkit>=3.0.52",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "ruff>=0.13",
]

[project.scripts]
agc = "agc.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agc"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes (unused imports, etc.)
    "I",      # isort (import sorting)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B028",   # no explicit stacklevel
    "SIM108", # use ternary operator
    "B027",   # empty method in ABC is optional hook, not abstract
]

[tool.ruff.lint.isort]
known-first-party = ["agc"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
